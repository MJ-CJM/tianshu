[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu"
version = "0.1.0"
description = "Tianshu - Async AI Execution Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-ulid>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "watchdog>=4.0",
    "croniter>=2.0",
    "trafilatura>=1.12",
    "cachetools>=5.3",
    "cryptography>=42",
    "lark-oapi>=1.4.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
cli = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "websockets>=12.0",
]
notify = [
    "aiosmtplib>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
scrapling = ["scrapling>=0.3"]

[project.scripts]
tianshu = "tianshu.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
