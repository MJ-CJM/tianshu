[build-system]
requires = ["setuptools>=77.0"]
# in-tree 后端：构建前清空 setuptools 暂存树（否则陈旧产物会混进 wheel，
# 同源码构建出不同结果），且 wheel 缺 Web 载荷时 fail-closed。见 build_backend/。
build-backend = "tianshu_build"
backend-path = ["build_backend"]

[project]
name = "tianshu"
version = "0.4.2"
description = "Tianshu - Async AI Execution Platform"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "MJ-CJM" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "python-ulid>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.84.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "watchdog>=4.0",
    "croniter>=2.0",
    "cachetools>=5.3",
    "cryptography>=48.0.1",
    # ``tianshu`` console script is always installed, so its imports must be
    # present in the base distribution rather than hidden behind an extra.
    "typer>=0.12",
    "rich>=13.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/MJ-CJM/tianshu"
Repository = "https://github.com/MJ-CJM/tianshu"
Issues = "https://github.com/MJ-CJM/tianshu/issues"
Documentation = "https://github.com/MJ-CJM/tianshu/blob/main/docs/README.md"

[project.optional-dependencies]
# Kept as an empty compatibility alias for existing ``tianshu[cli]`` install
# commands. CLI dependencies are now part of the base package.
cli = []
notify = [
    "aiosmtplib>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "build>=1.2",
    "pip-audit==2.9.0",
]
scrapling = ["scrapling[fetchers]>=0.3"]
feishu = ["lark-oapi>=1.4.0"]
telegram = ["python-telegram-bot>=22.6,<23"]
# lxml 显式声明：DuckDuckGo 搜索引擎（NETWORK_DEFAULT/NETWORK_RESEARCH 两个档位的
# 默认 search_provider）硬依赖它。此前只靠 trafilatura/scrapling 传递带入——一次上游
# 依赖调整就会让默认搜索引擎无声消失。
web = ["trafilatura>=1.12", "lxml>=5.3"]
mcp = ["mcp>=1.0"]
# OTel GenAI 埋点(迭代 3):默认不装、默认关;设 TIANSHU_OTEL_ENDPOINT 才导出。
# semconv gen_ai.* 仍 experimental,故薄封装集中定义属性,升级只改一处。
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# LSP 诊断(迭代 5):edit 落盘即跑 basedpyright(pip 单依赖内嵌 Node runtime);
# TIANSHU_LSP_ENABLED 才启用,未装则静默跳过。
lsp = ["basedpyright>=1.20"]
all = ["tianshu[feishu,telegram,web,mcp,cli,notify]"]

[project.scripts]
tianshu = "tianshu.cli.main:app"
tianshu-lean-demo = "tianshu.lean_preview_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tianshu = [
    "py.typed",
    "resources/LICENSE",
    "resources/models_catalog.json",
    "resources/personas/**/*",
    "resources/persona_templates/**/*",
    "skills/builtin/**/*",
    "web/static/**/*",
    "executor/templates/**/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: 真实子进程/慢测试",
    "unit: 纯单元测试（无 IO / 无外部依赖）",
    "integration: 跨组件集成测试（真 Storage / 多协作者编排）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.coverage.run]
source = ["src/tianshu"]

[tool.coverage.report]
skip_covered = false
show_missing = false

[tool.mypy]
python_version = "3.12"
packages = ["tianshu.models", "tianshu.kernel", "tianshu.bus", "tianshu.dag", "tianshu.config", "tianshu.storage", "tianshu.secrets", "tianshu.memory", "tianshu.persona", "tianshu.tools.mcp", "tianshu.security"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",  # 行宽交给 formatter
    # 下面 4 条是本次（B1-T8）首次 lint 落地时的残余处置，非长期豁免，后续批次收紧：
    "UP042",   # str+Enum → StrEnum 会改变 str()/序列化行为（11 处核心枚举），需专项验证后再迁移
    "ASYNC240",  # async 函数内阻塞 pathlib/os.path 调用（16 处），修复需引入 to_thread 等重构，超出本次 lint-fix 范围
    "ASYNC221",  # async 函数内阻塞子进程调用（5 处，均为测试代码），同上
    "ASYNC109",  # async 函数以 timeout 参数暴露超时（2 处），改法是破坏性 API 变更，暂缓
]

[tool.importlinter]
root_package = "tianshu"

[[tool.importlinter.contracts]]
name = "分层:底层契约不得向上依赖"
type = "layers"
layers = [
    "tianshu.gateway : tianshu.executor : tianshu.scheduler : tianshu.bootstrap : tianshu.universe",
    "tianshu.storage : tianshu.secrets : tianshu.memory : tianshu.persona : tianshu.skills",
    "tianshu.kernel : tianshu.models : tianshu.config : tianshu.bus",
]
ignore_imports = [
    # TYPE_CHECKING-only 类型标注（bind_persona 参数类型），运行时零依赖；kernel 在 mypy 覆盖范围内需要该导入解析类型
    "tianshu.kernel.ambient -> tianshu.persona.model",
]

[[tool.importlinter.contracts]]
name = "extras 独立性:telegram 不得依赖 feishu"
type = "forbidden"
source_modules = ["tianshu.gateway.telegram"]
forbidden_modules = ["tianshu.gateway.feishu"]
