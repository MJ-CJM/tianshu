[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu"
version = "0.1.0"
description = "Tianshu - Async AI Execution Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-ulid>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "watchdog>=4.0",
    "croniter>=2.0",
    "cachetools>=5.3",
    "cryptography>=42",
]

[project.optional-dependencies]
cli = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "websockets>=12.0",
]
notify = [
    "aiosmtplib>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
scrapling = ["scrapling[fetchers]>=0.3"]
feishu = ["lark-oapi>=1.4.0"]
telegram = ["python-telegram-bot>=22.6,<23"]
web = ["trafilatura>=1.12"]
mcp = ["mcp>=1.0"]
all = ["tianshu[feishu,telegram,web,mcp,cli,notify]"]

[project.scripts]
tianshu = "tianshu.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: 真实子进程/慢测试",
    "unit: 纯单元测试（无 IO / 无外部依赖）",
    "integration: 跨组件集成测试（真 Storage / 多协作者编排）",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.coverage.run]
source = ["src/tianshu"]

[tool.coverage.report]
skip_covered = false
show_missing = false

[tool.mypy]
python_version = "3.12"
packages = ["tianshu.models", "tianshu.kernel", "tianshu.bus", "tianshu.dag", "tianshu.config"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",  # 行宽交给 formatter
    # 下面 4 条是本次（B1-T8）首次 lint 落地时的残余处置，非长期豁免，后续批次收紧：
    "UP042",   # str+Enum → StrEnum 会改变 str()/序列化行为（11 处核心枚举），需专项验证后再迁移
    "ASYNC240",  # async 函数内阻塞 pathlib/os.path 调用（16 处），修复需引入 to_thread 等重构，超出本次 lint-fix 范围
    "ASYNC221",  # async 函数内阻塞子进程调用（5 处，均为测试代码），同上
    "ASYNC109",  # async 函数以 timeout 参数暴露超时（2 处），改法是破坏性 API 变更，暂缓
]
