name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high
          # Mirrors the exact-version, expiring RSC-only exception documented
          # in security/npm-audit-allowlist.json.
          allow-ghsas: GHSA-qwww-vcr4-c8h2

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra all --extra dev
      - name: Audit all Python dependency extras
        run: |
          uv export --frozen --all-extras --no-dev --format requirements-txt --no-emit-project |
            uv run --frozen pip-audit -r /dev/stdin --no-deps --disable-pip --progress-spinner=off
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not slow" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node ../scripts/check_npm_audit.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12 --all-extras
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web

  # 发行物正确性：backend job 的 `-m "not slow"` 把 wheel manifest 与黑盒全部排除在外，
  # 于是"干净检出构建出的 wheel 没有 Web 界面"这类回归 CI 永远发现不了。这个 job 从
  # 干净检出走完整的发行链路（前端构建 → wheel）并断言归档内容。
  release-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Build frontend into the wheel payload
        run: npm ci && npm run build
        working-directory: web
      - name: Wheel manifest assertions (web/static + brand.png + 六部门资源)
        run: uv run pytest tests/resources/test_wheel_manifest.py -q

      # sdist 是发行链路的另一条腿：build_backend/ 是 backend-path 指向的 in-tree
      # 后端，setuptools 不会自动收录它 —— 缺了它，从 sdist 构建/安装直接断掉，而
      # 只跑 wheel 路径的 CI 看不见。这里从干净检出走完整 sdist → wheel → 安装 → smoke。
      - name: sdist → wheel → install → smoke
        run: |
          set -euo pipefail
          rm -rf dist build
          uv build --sdist
          uv build --wheel dist/*.tar.gz --out-dir dist/from-sdist
          uv venv /tmp/sdist-smoke --python 3.12
          VIRTUAL_ENV=/tmp/sdist-smoke uv pip install "$(ls dist/from-sdist/*.whl)[cli]"
          /tmp/sdist-smoke/bin/python -c "import tianshu, tianshu.app; print('sdist wheel importable:', tianshu.__file__)"
          /tmp/sdist-smoke/bin/tianshu doctor --format json > /dev/null
