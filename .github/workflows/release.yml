name: release

# tag 触发的发布链路：复用 ci.yml release-wheel 验证过的构建顺序
# （前端先构建 → wheel 清单断言 → sdist → wheel → 安装 smoke），
# 通过后把 wheel + sdist + 校验和附到 GitHub Release，再发布到 PyPI。
# PyPI 走 Trusted Publishing（OIDC），仓库不存任何长期 token。
# GHCR 与签名 provenance 仍为 deferred。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # environment 让 PyPI 侧的 pending publisher 可以按 environment 收口，
    # 也给这条链路留出「发布前需人工审批」的挂载点（保护规则在仓库设置里配）。
    environment:
      name: pypi
      url: https://pypi.org/p/tianshu-agent-os
    permissions:
      contents: write
      id-token: write # Trusted Publishing 的 OIDC 令牌
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Build frontend into the wheel payload
        run: npm ci && npm run build
        working-directory: web
      - name: Wheel manifest assertions
        run: uv run pytest tests/resources/test_wheel_manifest.py -q
      - name: Build sdist and wheel, then smoke-test the install
        run: |
          set -euo pipefail
          rm -rf dist build
          uv build --sdist
          uv build --wheel dist/*.tar.gz --out-dir dist/from-sdist
          uv venv /tmp/sdist-smoke --python 3.12
          VIRTUAL_ENV=/tmp/sdist-smoke uv pip install "$(ls dist/from-sdist/*.whl)[cli]"
          /tmp/sdist-smoke/bin/python -c "import tianshu, tianshu.app; print('sdist wheel importable:', tianshu.__file__)"
          # demo 档位：发布环境没有真实 LLM 凭证，而 provider.config 是 required
          # 检查，live 档位下必然 fail 并让 doctor 退出 1。见 ci.yml 同一处说明。
          TIANSHU_STARTUP_PROFILE=demo /tmp/sdist-smoke/bin/tianshu doctor --format json > /dev/null
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.tar.gz release-assets/
          cp dist/from-sdist/*.whl release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)。产物校验和见 SHA256SUMS.txt。" \
            release-assets/*

      # 只放 sdist 与「从该 sdist 构建出的」wheel：release-assets/ 还有
      # SHA256SUMS.txt，混进上传集会被 twine 拒绝；dist/ 根目录下的 wheel 也不取，
      # 保证发布出去的正是通过了 sdist→wheel→安装 smoke 的那一个。
      - name: Stage the PyPI upload set
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/*.tar.gz pypi-dist/
          cp dist/from-sdist/*.whl pypi-dist/
          ls -1 pypi-dist/

      # 排在 GitHub Release 之后：PyPI 同一版本号不可重传，若先发 PyPI 再失败，
      # 版本号就被烧掉了；反过来 Release 已建、PyPI 未发，重跑本 job 即可补齐。
      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist
