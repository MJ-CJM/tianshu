<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 墨环朱枢:北斗七星 + 枢轴十字,墨色随系统深浅切换,朱砂恒在 -->
  <style>
    .ink { stroke: #1F1E1B; }
    .ink-fill { fill: #1F1E1B; }
    .zhu { stroke: #AE3F2C; }
    .zhu-fill { fill: #AE3F2C; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #EAE6DC; }
      .ink-fill { fill: #EAE6DC; }
      .zhu { stroke: #D96C52; }
      .zhu-fill { fill: #D96C52; }
    }
  </style>

  <!-- 外环:轨道 -->
  <circle cx="16" cy="16" r="14" fill="none" class="ink" stroke-width="1.1" opacity="0.75"/>
  <!-- 内环:枢 -->
  <circle cx="16" cy="16" r="9.5" fill="none" class="ink" stroke-width="0.7" opacity="0.4" stroke-dasharray="3 2.4"/>

  <!-- 枢轴十字(朱砂) -->
  <line x1="16" y1="9.5" x2="16" y2="22.5" class="zhu" stroke-width="1.7"/>
  <line x1="9.5" y1="16" x2="22.5" y2="16" class="zhu" stroke-width="1.7"/>
  <!-- 星核 -->
  <circle cx="16" cy="16" r="2.1" class="zhu-fill"/>

  <!-- 北斗七星(墨) -->
  <circle cx="8" cy="7" r="1" class="ink-fill" opacity="0.8"/>
  <circle cx="11.5" cy="6" r="0.8" class="ink-fill" opacity="0.65"/>
  <circle cx="15" cy="7.5" r="0.7" class="ink-fill" opacity="0.5"/>
  <circle cx="18.5" cy="9" r="0.7" class="ink-fill" opacity="0.5"/>
  <circle cx="22" cy="8" r="0.6" class="ink-fill" opacity="0.4"/>
  <circle cx="24" cy="10.5" r="0.6" class="ink-fill" opacity="0.4"/>
  <circle cx="21.5" cy="12" r="0.6" class="ink-fill" opacity="0.4"/>

  <!-- 斗柄连线 -->
  <polyline points="8,7 11.5,6 15,7.5 18.5,9" fill="none" class="ink" stroke-width="0.4" opacity="0.35"/>
  <polyline points="18.5,9 22,8 24,10.5 21.5,12 18.5,9" fill="none" class="ink" stroke-width="0.35" opacity="0.3"/>

  <!-- 外环四向刻度 -->
  <line x1="16" y1="1" x2="16" y2="3.5" class="ink" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="28.5" x2="16" y2="31" class="ink" stroke-width="0.8" opacity="0.5"/>
  <line x1="1" y1="16" x2="3.5" y2="16" class="ink" stroke-width="0.8" opacity="0.5"/>
  <line x1="28.5" y1="16" x2="31" y2="16" class="ink" stroke-width="0.8" opacity="0.5"/>
</svg>
